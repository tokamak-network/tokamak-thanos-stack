# CrossTrade is excluded — Gaming does not include DeFi modules.

bridge:
  enabled: true

blockExplorer:
  enabled: true

monitoring:
  enabled: true

uptime:
  enabled: true

crossTrade:
  enabled: false

drb:
  enabled: true

aaPaymaster:
  enabled: true
